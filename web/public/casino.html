<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casino · Dealers Choice</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/art/brand/logo-mark-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/art/brand/logo-mark-64.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/art/brand/logo-mark-512.png">
<link rel="apple-touch-icon" href="assets/art/brand/logo-mark-180.png">
<script src="js/frame.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/table.css">
<link rel="stylesheet" href="css/casino.css">
</head>
<body>
<header id="site-header"></header>
<main class="table-page">
  <section id="chooser" class="wrap" style="padding:0"></section>
  <section id="room" hidden>
    <div class="table-top">
      <button class="btn sm" type="button" data-cmd="menu">← All casino games</button>
      <h1 id="cz-title">Casino</h1>
      <span class="sub cz-subtitle" id="cz-subtitle"></span>
      <span class="sub" id="cz-stakes"></span>
      <span class="spacer"></span>
      <span class="cz-bank-top" id="cz-bank"></span>
      <div class="row">
        <button class="btn sm" type="button" data-cmd="rules">How to play</button>
        <button class="btn sm" type="button" data-cmd="options">Options</button>
        <button class="btn sm" type="button" data-cmd="stats">Stats</button>
      </div>
    </div>
    <div class="felt cz-felt" id="cz-felt" aria-label="Casino table"></div>
    <div class="cz-dock">
    <p class="cz-msg" id="cz-msg" role="status" aria-live="polite" tabindex="-1"></p>
    <div class="cz-betbar">
      <div class="cz-rack" id="cz-rack" role="radiogroup" aria-label="Chip to bet"></div>
      <div class="cz-betinfo">Bet <b id="cz-total">$0</b></div>
      <div class="cz-betbtns">
        <button class="btn sm" type="button" data-cmd="clear" id="cz-clear">Clear</button>
        <button class="btn sm" type="button" data-cmd="rebet" id="cz-rebet">Rebet</button>
        <button class="btn primary" type="button" data-cmd="action" id="cz-action">Deal</button>
      </div>
    </div>
    </div>
  </section>
</main>
<dialog id="cz-dialog" aria-labelledby="cz-dialog-title"></dialog>
<dialog id="cz-rules" class="howto" aria-labelledby="cz-rules-title">
  <div class="howto-head">
    <h2 id="cz-rules-title">How to play</h2>
    <form method="dialog"><button class="howto-close" aria-label="Close">×</button></form>
  </div>
  <div id="cz-rules-body" class="howto-body" tabindex="0" role="region" aria-label="Rules"></div>
  <form method="dialog" class="howto-foot"><span></span><button class="btn primary">Got it</button></form>
</dialog>
<footer id="site-footer"></footer>
<script type="module" src="js/casino/ui.js"></script>
</body>
</html>
