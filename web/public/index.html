<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dealers Choice</title>
<meta name="description" content="Dealers Choice: classic card games in your browser.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/art/brand/logo-mark-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/art/brand/logo-mark-64.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/art/brand/logo-mark-512.png">
<link rel="apple-touch-icon" href="assets/art/brand/logo-mark-180.png">
<!-- Site shell: owns the background music and shows every screen in a full-window frame, so the
     music plays straight through moving between the lobby and the games. Screens are ordinary
     pages (lobby.html, play.html, ...); js/frame.js sends any screen opened on its own back here. -->
<style>
  html, body { margin: 0; height: 100%; background: #0E241D; overflow: hidden; }
  #screen { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #0E241D; }
</style>
<script>
  // A link to "/" followed inside the frame would nest a second shell: show the lobby instead.
  if (window.top !== window) location.replace('lobby.html' + location.hash);
</script>
</head>
<body>
<iframe id="screen" title="Dealers Choice"></iframe>
<script type="module">
  import { startMusic, stopMusic, setMusicVolume, nowPlaying, musicStatus, bufferMusic } from './js/core/music.js';
  import { gesture, effect, preload, audioStatus, ACTIVATION_EVENTS, activates } from './js/core/audio.js';
  import { applyMusic } from './js/core/sound.js';

  // Screens call these through window.top (see js/core/sound.js), so one audio graph and one
  // music player serve every page, and a tap on any screen unlocks sound for all of them.
  window.dcAudio = { startMusic, stopMusic, setMusicVolume, nowPlaying, musicStatus, gesture, effect, preload, audioStatus };
  for (const type of ACTIVATION_EVENTS) window.addEventListener(type, (e) => { if (activates(e, navigator)) gesture(); }, { capture: true, passive: true });
  // Load the session's song now, before the lobby asks for it, so the first tap plays it at once
  // (and play it straight away if this browser allows sound without a tap). It buffers in full
  // once the first screen has loaded.
  applyMusic();

  // Only pages inside the site's own folder may be loaded into the frame (paths are relative,
  // so the site works at / or under a subfolder).
  const SAFE = /^(?!.*\.\.)[A-Za-z0-9._~\-\/]+(\?[^#\s]*)?(#\S*)?$/;
  const asked = (new URLSearchParams(location.search).get('p') ?? '').replace(/^\/+/, '');
  const start = SAFE.test(asked) ? asked : 'lobby.html' + location.hash;

  const frame = document.getElementById('screen');
  frame.addEventListener('load', bufferMusic, { once: true });
  frame.addEventListener('load', () => {
    try {
      const w = frame.contentWindow;
      // Mirror the screen's address and title, so refresh, bookmarks and sharing point at it.
      history.replaceState(null, '', w.location.pathname + w.location.search + w.location.hash);
      const syncTitle = () => { document.title = w.document.title || 'Dealers Choice'; };
      syncTitle();
      new MutationObserver(syncTitle).observe(w.document.head, { subtree: true, childList: true, characterData: true });
      w.addEventListener('hashchange', () => history.replaceState(null, '', w.location.pathname + w.location.search + w.location.hash));
      w.focus();
    } catch { /* not same-origin: leave the shell's address alone */ }
  });
  frame.src = start;
</script>
</body>
</html>
