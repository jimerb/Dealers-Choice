<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="js/frame.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinochle · Dealers Choice</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/art/brand/logo-mark-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/art/brand/logo-mark-64.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/art/brand/logo-mark-512.png">
<link rel="apple-touch-icon" href="assets/art/brand/logo-mark-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/table.css">
</head>
<body>
<header id="site-header"></header>
<main class="table-page">
  <div class="table-top">
    <a class="btn sm" href="lobby.html">← Lobby</a>
    <h1>Pinochle</h1>
    <span class="sub" id="sub">Partnership Auction</span>
    <span class="spacer"></span>
    <span class="scores" id="scores" aria-label="Scores"></span>
    <span class="sub" id="target">to 1,000</span>
    <button class="btn sm" type="button" id="btn-howto">How to play</button>
    <button class="btn sm" type="button" id="btn-new">New game</button>
  </div>
  <div class="table-layout">
    <section class="felt" id="felt" aria-label="Card table"></section>
    <aside class="side" id="side" aria-label="Hand details"></aside>
  </div>
</main>
<dialog id="howto" class="howto" aria-labelledby="howto-title">
  <div class="howto-head">
    <h2 id="howto-title">How to play</h2>
    <form method="dialog"><button class="howto-close" aria-label="Close">×</button></form>
  </div>
  <div id="howto-body" class="howto-body" tabindex="0" role="region" aria-label="How to play"></div>
  <form method="dialog" class="howto-foot">
    <label class="choice"><input type="checkbox" id="howto-auto" checked> Show this the first time I open a game</label>
    <button class="btn primary">Got it</button>
  </form>
</dialog>
<dialog id="newgame" aria-labelledby="newgame-title">
  <h2 id="newgame-title">New game</h2>
  <form method="dialog">
    <fieldset class="field"><legend>Choose a game</legend><div id="variant-list" class="variant-list"></div></fieldset>
    <p class="newgame-warn" id="newgame-warn" hidden></p>
    <div class="dialog-actions"><button class="btn" value="keep" id="newgame-keep">Cancel</button><button class="btn primary" value="deal">Deal</button></div>
  </form>
</dialog>
<footer id="site-footer"></footer>
<script type="module" src="js/games/pinochle/ui.js"></script>
</body>
</html>
