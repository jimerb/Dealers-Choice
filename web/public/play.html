<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/js/frame.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dealers Choice</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/art/brand/logo-mark-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/art/brand/logo-mark-64.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/art/brand/logo-mark-512.png">
<link rel="apple-touch-icon" href="/assets/art/brand/logo-mark-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="/css/table.css">
</head>
<body>
<header id="site-header"></header>
<main class="table-page">
  <div class="table-top">
    <a class="btn sm" href="/lobby.html#games">← Lobby</a>
    <h1 id="game-title">Loading…</h1>
    <span class="sub" id="sub"></span>
    <span class="spacer"></span>
    <span id="scores" class="row"></span>
    <button class="btn sm" type="button" id="btn-rules">Rules</button>
    <button class="btn sm" type="button" id="btn-new">New game</button>
  </div>
  <div class="table-layout">
    <section class="felt generic" id="felt" aria-label="Card table"></section>
    <aside class="side" id="side" aria-label="Game details"></aside>
  </div>
</main>
<dialog id="rules" aria-labelledby="rules-title">
  <h2 id="rules-title">How to play</h2>
  <div id="rules-body" class="rules-body"></div>
  <form method="dialog" class="dialog-actions"><button class="btn primary">Got it</button></form>
</dialog>
<dialog id="game-settings" aria-labelledby="gs-title">
  <form id="gs-form">
    <h2 id="gs-title">New game</h2>
    <div id="gs-body"></div>
    <div class="dialog-actions"><button class="btn" type="button" id="gs-cancel">Cancel</button><button class="btn primary" type="submit">Deal</button></div>
  </form>
</dialog>
<footer id="site-footer"></footer>
<script type="module">
  import { GAMES } from '/js/catalog.js';
  import { mountTable } from '/js/core/table.js';
  const id = new URLSearchParams(location.search).get('g');
  const entry = GAMES.find((g) => g.id === id && g.module);
  if (!entry) {
    location.replace('/lobby.html#games');
  } else {
    const mod = await import(`/js/games/${entry.module}.js`);
    mountTable(mod.default);
  }
</script>
</body>
</html>
