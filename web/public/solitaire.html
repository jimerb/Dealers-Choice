<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solitaire · Dealers Choice</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/art/brand/logo-mark-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/art/brand/logo-mark-64.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/art/brand/logo-mark-512.png">
<link rel="apple-touch-icon" href="assets/art/brand/logo-mark-180.png">
<script src="js/frame.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/table.css">
<link rel="stylesheet" href="css/solitaire.css">
</head>
<body>
<header id="site-header"></header>
<main class="table-page sol-page">
  <section id="chooser" class="wrap" style="padding:0"></section>
  <section id="board" hidden>
    <div class="table-top">
      <button class="btn sm" type="button" data-cmd="menu" id="back-menu">← <span class="t-long">All solitaires</span><span class="t-short">All</span></button>
      <h1 id="sol-title">Solitaire</h1>
      <span class="sub" id="sol-status"></span>
      <span class="spacer"></span>
      <div class="row" id="sol-tools">
        <button class="btn sm" type="button" data-cmd="rules"><span class="t-long">How to play</span><span class="t-short">Rules</span></button>
        <button class="btn sm" type="button" data-cmd="undo">Undo</button>
        <button class="btn sm" type="button" data-cmd="auto"><span class="t-long">Auto-finish</span><span class="t-short">Finish</span></button>
        <button class="btn sm" type="button" data-cmd="restart"><span class="t-long">Restart deal</span><span class="t-short">Restart</span></button>
        <button class="btn sm primary" type="button" data-cmd="new"><span class="t-long">New deal</span><span class="t-short">New</span></button>
      </div>
    </div>
    <p class="sub" id="sol-sub" style="margin:-6px 0 12px"></p>
    <div class="felt sol-felt" id="sol-area" aria-label="Solitaire table"></div>
    <p class="sub" id="sol-hint" style="margin-top:10px"></p>
  </section>
</main>
<dialog id="sol-rules" class="howto" aria-labelledby="sol-rules-title">
  <div class="howto-head">
    <h2 id="sol-rules-title">How to play</h2>
    <form method="dialog"><button class="howto-close" aria-label="Close">×</button></form>
  </div>
  <div id="sol-rules-body" class="howto-body" tabindex="0" role="region" aria-label="Rules"></div>
  <form method="dialog" class="howto-foot">
    <label class="choice"><input type="checkbox" id="sol-howto-auto" checked> Show this when I open a new layout</label>
    <button class="btn primary">Got it</button>
  </form>
</dialog>
<footer id="site-footer"></footer>
<script type="module" src="js/solitaire/ui.js"></script>
</body>
</html>
