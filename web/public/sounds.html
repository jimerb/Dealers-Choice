<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/js/frame.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound board · Dealers Choice</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap" data-nosfx>
  <div class="section-head"><h2>Sound board</h2></div>
  <p style="color:var(--ink-2);max-width:720px">Our own sound effects, one per game event. Click one to hear it. To change a sound, edit its recipe in <code>tools/art/build_sounds.py</code> and re-run it; to remap an event, edit the <code>SFX</code> map in <code>web/public/js/core/sound.js</code>.</p>
  <h3>Game events</h3>
  <div class="tiles" id="events" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))"></div>
</main>
<footer id="site-footer"></footer>
<script type="module">
  import { mountChrome } from '/js/header.js';
  import { SFX, SOUND_PACK, play } from '/js/core/sound.js';
  mountChrome('');
  document.getElementById('events').innerHTML = Object.entries(SFX).map(([name, file]) =>
    `<button class="btn" data-id="${file}" style="justify-content:space-between"><span>${name}</span><span style="color:var(--ink-3)">${file}.wav</span></button>`).join('');
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-id]'); if (b) new Audio(`${SOUND_PACK}/${b.dataset.id}.wav`).play(); });
  void play;
</script>
</body>
</html>
